[package]
name = "cex-runner"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cex_runner"
path = "src/lib.rs"

[[bin]]
name = "cex-runner"
path = "src/main.rs"

[dependencies]
cex-engine = { path = "../engine" }
cex-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
# 0.29 对应约束 ^4.3,但 ^4 会解析到 librdkafka 2.x(强制依赖系统 libcurl);
# 直接锁定 sys 4.5.0(= 4.5.0+1.9.2,librdkafka 1.9.2),无需 libcurl
rdkafka = { version = "0.29", default-features = false, features = ["cmake-build", "libz-static", "tokio"] }
rdkafka-sys = "=4.5.0"
futures = "0.3"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
